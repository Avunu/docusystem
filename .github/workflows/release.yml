name: Release

# release-please keeps a release pull request open on main, built from Conventional Commits. Merging it
# tags vX.Y.Z and creates the GitHub Release and the changelog; this same workflow then publishes the
# package to npm, signed with provenance. There is no moving tag (no `v1`): callers of the reusable
# workflows pin a commit.
#
# Publishing, tagging and the release PR are ONE workflow file on purpose. npm trusted publishing
# validates the workflow file name of the run, so the name configured on npmjs.com must be `release.yml`
# and the publish step must be in this file. release-please's tags are created with GITHUB_TOKEN, which
# starts no `push: tags` workflows, so the publish cannot be a separate tag-triggered workflow either.
#
# Also on a schedule: Dependabot pull requests are merged with GITHUB_TOKEN, and a push made with that
# token starts no workflows, so without it the release PR would stop picking up those commits.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # tags and the GitHub Release
      pull-requests: write # the release pull request
      actions: write # dispatch ci.yml on the release pull request's branch
    outputs:
      release-created: ${{ steps.rp.outputs.release_created }}
      tag-name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
      sha: ${{ steps.rp.outputs.sha }}
    steps:
      - name: release-please
        id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A pull request opened or updated with GITHUB_TOKEN starts no `pull_request` workflows, so the
      # required `ci` check would never report on the release commit. A dispatched run does start, and
      # its checks attach to the branch head.
      - name: Run CI on the release pull request
        if: ${{ steps.rp.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PR: ${{ steps.rp.outputs.pr }}
        run: |
          branch="$(echo "$RELEASE_PR" | jq -r '.headBranchName')"
          gh workflow run ci.yml --ref "$branch"

  publish:
    name: Publish to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.release-created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The GitHub environment `npm` is limited to main and is the one named in the trusted-publisher
    # configuration on npmjs.com, so a run from any other branch cannot obtain a publish token.
    environment: npm
    permissions:
      contents: read # checkout
      id-token: write # the OIDC token npm exchanges for a publish token, and the provenance signature
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      # Node 24 ships npm 11.19, above the 11.5.1 that trusted publishing needs; nothing is installed
      # over it. No cache: this job produces what users install.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install, check and build at the release commit
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm run build
          npm run check:pack

      - name: Publish (skipped when the version already exists)
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          # Used only until the trusted publisher is configured on npmjs.com (MAINTAINING.md, first
          # release). Once it is, npm exchanges the OIDC token first and this is never read; a follow-up
          # pull request deletes this line, the secret and the token after the first tokenless release.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name="$(node -p "require('./package.json').name")"
          have="$(node -p "require('./package.json').version")"
          if [ "$have" != "$VERSION" ]; then
            echo "::error::package.json says $have but release-please released $VERSION"
            exit 1
          fi
          if npm view "$name@$VERSION" version > /dev/null 2>&1; then
            echo "$name@$VERSION is already on npm; nothing to publish"
          else
            # When the OIDC exchange is refused (the trusted publisher on npmjs.com does not match this
            # run, or does not allow a direct publish) or skipped (no id-token permission), npm only
            # prints ENEEDAUTH, "log in". The registry's actual reason is a verbose-level line
            # (`npm verbose oidc ...`), so this one command logs at verbose. That does not expose a
            # secret: npm does not log the OIDC token or the exchanged token, and GitHub masks NPM_TOKEN.
            if ! npm publish --provenance --access public --loglevel verbose; then
              echo "::error title=npm publish failed::If the log says ENEEDAUTH, npm's OIDC token exchange was refused or skipped: the reason is the 'npm verbose oidc' line. Compare the trusted publisher on npmjs.com with this run (repository Avunu/docusystem, workflow release.yml, environment npm, permission publish; see MAINTAINING.md), then re-run the failed publish job."
              exit 1
            fi
          fi

name: CI

# One required check, `ci`, that gathers the rest: a ruleset on main requires it and nothing else, so a
# job can be renamed, added or removed without editing the ruleset. `ci` passes when every job it waits
# for succeeded or was skipped (the workspace job skips itself when the change cannot reach the
# documentation site).
#
# A plain `pull_request` workflow: a fork's pull request gets a read-only token and no secrets, and
# nothing here publishes. Publishing is deploy.yml.
#
# `workflow_dispatch` is how a pull request opened by a workflow gets its checks: a pull request opened
# with GITHUB_TOKEN starts no `pull_request` workflows, so the bump of the documentation submodules
# (bump.yml) dispatches this workflow on its branch when it has no DOCS_BUMP_TOKEN, and the run reports `ci`
# on the branch head.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Format, lint, types, tests
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    timeout-minutes: 20
    permissions:
      contents: read # checkout
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install the locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Format, lint, types, then the unit and integration tests (the integration project runs the real
      # pinned Jx on fixture workspaces: the answer to "a Jx wording change made strictness fail open").
      - name: Check
        run: npm run check
      - name: Build
        run: npm run build

  # The unit tests on Windows. Windows is unsupported for the build itself (nothing here builds a site
  # on it); this finds path-separator and line-ending bugs early. The job is expected
  # to pass: .gitattributes checks text out as LF and the tests are platform-aware (CONTRIBUTING.md,
  # "Tests on Windows"). It is informational only because it is not in the `needs` of `ci` and
  # `continue-on-error` reports a failure as an annotation without failing the run. To make it a required
  # check: add `windows` to the `needs` of the `ci` job below, delete `continue-on-error` here, and change
  # the assertions of test/workflows/ci.test.ts that pin both.
  windows:
    name: Unit tests on Windows (informational)
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read # checkout
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install the locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit tests only
        run: npm test -- --project unit

  # The browser suites (verify/): axe on every page at three widths in both colour schemes plus the open
  # overlays, the navigation drawer, the project switcher, the code fences, the edge cases of real
  # READMEs and the content security policy. They run on a small fixture workspace (verify/fixtures),
  # built by the same `check` that CI runs on the real site; `run.ts` does the build and every suite.
  # `shots.ts` leaves screenshots at 1440, 768 and 390 pixels in both schemes for a human to look at; there
  # is no pixel diff.
  verify:
    name: Accessibility and behaviour in Chrome
    # Hosted on purpose: on the shared self-hosted host, page loads under load pass the 30 s timeout.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"
          no-cache: true
      - name: Install the locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Install the browser suites
        working-directory: verify
        run: bun install --frozen-lockfile
      - name: Use Chromium from Nix on the self-hosted runner
        if: ${{ runner.environment == 'self-hosted' }}
        run: echo "CHROME_BIN=$(nix build --no-link --print-out-paths nixpkgs#chromium)/bin/chromium" >> "$GITHUB_ENV"
      - name: Build the fixture workspace and run every suite
        working-directory: verify
        run: bun run.ts --out "$RUNNER_TEMP/verify"
      - name: Upload the screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-shots
          path: ${{ runner.temp }}/verify/shots
          retention-days: 7
          if-no-files-found: ignore

  workflows:
    name: Workflow lint
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    timeout-minutes: 10
    permissions:
      contents: read # checkout, and zizmor's online audits read public repositories
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --silent --show-error --location --output actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
      - name: actionlint
        run: ./actionlint -color .github/workflows/*.yml
      # zizmor-action fetches the zizmor wheel with `python3 -m pip`; the runner's Nix python3 has no pip.
      - name: Use a Python with pip from Nix on the self-hosted runner
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          python="$(nix build --no-link --print-out-paths --impure --expr \
            '(builtins.getAttr builtins.currentSystem (builtins.getFlake "nixpkgs").legacyPackages).python3.withPackages (ps: [ ps.pip ])')"
          echo "${python}/bin" >> "$GITHUB_PATH"
      - name: zizmor on this repository
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.30.1"
          persona: pedantic
          advanced-security: false
          inputs: >-
            .github/workflows
            .github/dependabot.yml

  pr-title:
    name: Pull request title
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    timeout-minutes: 5
    permissions:
      contents: read # checkout
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      # The title reaches the script through the environment: it is written by whoever opens the pull
      # request and must never be interpolated into the command line.
      - name: A Conventional Commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-pr-title.mjs

  # The documentation workspace: every project's docs (the submodules under projects/) built together
  # and checked, the way deploy.yml builds the site. It runs only when the change can reach the site (the
  # same paths as the `push` filter of deploy.yml, plus this file; a test holds them in step), always on
  # a manual run (how the bump pull request, which only moves submodule pointers, gets its checks), and
  # not at all while the repository has no projects.json. A skipped run passes `ci`. The submodules are
  # fetched only when the check runs, over https alone: a pull request can edit .gitmodules, and what it
  # points at is content for the build to read, never code that runs.
  workspace:
    name: Workspace build
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    timeout-minutes: 30
    permissions:
      contents: read # checkout; the submodules are public
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the merge commit of a pull request and its parents, to see what changed
          persist-credentials: false
      - name: Does the change reach the site?
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          # The same list as `on.push.paths` of deploy.yml, as an extended regular expression.
          SITE_PATHS: '^(projects/|\.gitmodules$|projects\.json$|docs/|site/|src/|package\.json$|package-lock\.json$|projects\.schema\.json$|tsconfig[^/]*\.json$|\.github/workflows/(ci|deploy)\.yml$)'
        run: |
          if [ ! -f projects.json ]; then
            echo "::notice title=workspace::no projects.json: there is no workspace to build yet"
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] || ! git rev-parse --verify --quiet HEAD^1 > /dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          elif grep -Eq "$SITE_PATHS" <<< "$(git diff --name-only HEAD^1 HEAD)"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=workspace::the change does not reach the site; not built"
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch the submodules
        if: ${{ steps.changes.outputs.relevant == 'true' }}
        env:
          GIT_ALLOW_PROTOCOL: https
        run: git submodule update --init --depth 1 --recursive
      - name: Set up Node.js
        if: ${{ steps.changes.outputs.relevant == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install the locked dependencies
        if: ${{ steps.changes.outputs.relevant == 'true' }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the tool
        if: ${{ steps.changes.outputs.relevant == 'true' }}
        run: npm run build
      - name: Check and build the site
        if: ${{ steps.changes.outputs.relevant == 'true' }}
        env:
          CI: "true" # a document problem fails the build instead of being a warning
        run: node build/cli.js check

  ci:
    name: ci
    if: ${{ always() }}
    needs: [check, verify, workflows, pr-title, workspace]
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed (a skipped one is fine)
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
